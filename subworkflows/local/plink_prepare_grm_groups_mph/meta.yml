# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "plink_prepare_grm_groups_mph"
description: Build an ordered family of native MPH genetic relationship matrices from one or many disjoint named SNP groups
keywords:
  - mph
  - minque for partitioning heritability
  - genome relationship matrix
  - grm
components:
  - custom/mphsnpinfo
  - mph/makegrm
input:
  - ch_groups:
      description: |
        Required ordered TSV with header group_id and group_filename, and the disjoint SNP lists it names.
        The group IDs label matrix prefixes. Row order defines the output family order. One group uses the
        same API as several groups. The caller supplies the selected SNP universe; chromosomes are not filtered.
        Public outputs retain the focal group metadata. Genotypes are matched by meta.id. Neither called
        process can be switched off through this composition with `ext.when`, because the joins that carry
        identity forward are declared `failOnMismatch` and a skipped task leaves them unmatched.
      structure: [map meta, path group_manifest, list snp_group_files]
      pattern: "*.{tsv,txt}"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
        - edam: "http://edamontology.org/format_2330"
  - ch_genotypes:
      description: PLINK1 bundle for the focal family in the second metadata-bearing tuple. The three members share one basename.
      structure: [map meta2, path bed, path bim, path fam]
      pattern: "*.{bed,bim,fam}"
      ontologies:
        - edam: "http://edamontology.org/format_3003"
        - edam: "http://edamontology.org/format_2330"
output:
  - grm_family:
      description: |
        Every component's MPH matrix bundle and the matching prefixes in manifest ordinal order. The prefix of
        component k is `<family>__%06d_<group_id>`, and MPH copies it verbatim into the result's `vc_name`,
        so the published result names its own components.
      structure: [map meta, path grm_files, list grm_prefixes]
      pattern: "*.grm.{bin,iid}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - counts:
      description: |
        Declared predictor counts, one file per family: one row per component in ordinal order, then
        `__unassigned__` (BIM rows in no component) and `__bim_rows__`.
      structure: [map meta, path counts_tsv]
      pattern: "*.snp_info.counts.tsv"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
