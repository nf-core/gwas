# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "prepare_relatedness_matrices"
description: Build reusable base relatedness artifacts and their scientifically keyed derivatives once, then fan the selected artifact out to every unary analysis or explicit pair request that needs it
keywords:
  - relatedness
  - grm
  - kinship
  - deduplication
  - artifact identity
# The helper functions are listed alongside the subworkflow because `nf-core subworkflows lint`
# compares every `include` in main.nf against this list, and it lowercases the include name without
# lowercasing the entry it is matched against — so a camel-cased function name here is reported as
# missing. Function entries are therefore spelled lowercase.
components:
  - plink_prepare_grm_gcta
  - plink_prepare_ldms_plan_gcta
  - plink_prepare_grm_ldms_gcta
  - plink_prepare_grm_ldak
  - plink_prepare_grm_mph
  - plink_prepare_grm_ldms_mph
  - gcta/makebksparse
  - buildscientificartifactkey
  - canonicalisescientificidentifier
  - canonicalisescientificvalue
  - digestfilebytes
  - getmatrixkindcontract
  - getmethodcapabilities
input:
  - ch_analyses:
      description: One unary analysis or explicit pair request per element, carrying its cohort identity, selected methods, genotype files and optional LDAK weights Path. Validated matrix settings and optional extraction resources are carried in metadata.
      structure: "[map meta, list genotype_files, path ldak_weights|[]]"
      pattern: "*.{pgen,psam,pvar,bed,bim,fam,vcf,vcf.gz,weights}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - ch_cohort_native_genotypes:
      description: One native bundle per distinct cohort in format-polymorphic member order (primary genotype, variant file, sample file), carrying cohort metadata with meta.id set to the cohort identifier. The dense GCTA builder selects its native flag from the primary member's extension.
      structure: [map cohort_meta, path primary_genotype, path variant_file, path sample_file]
      pattern: "*.{bed,bim,fam,pgen,pvar,psam}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - ch_plink1_genotypes:
      description: The PLINK 1 view of every analysis whose selected method reads PLINK 1. Analyses on one cohort share one view upstream.
      structure: [map meta, path bed, path bim, path fam]
      pattern: "*.{bed,bim,fam}"
      ontologies:
        - edam: "http://edamontology.org/format_3003"
  - ch_cohort_native_view_keys:
      description: One native view key per cohort. A base request whose matrix kind declares the format-polymorphic bundle is keyed against this identity.
      structure: [val cohort_id, val native_view_key]
  - ch_cohort_plink1_view_keys:
      description: One PLINK 1 view key per cohort that has a PLINK 1 view. A base request whose matrix kind declares the PLINK 1 bundle is keyed against this identity; the channel is partial by design, and total for exactly those kinds.
      structure: [val cohort_id, val plink1_view_key]
  - gcta_grm_parts:
      description: Run/profile partition count used for every GCTA matrix build.
      structure: integer
output:
  - gcta_dense:
      description: The merged dense GCTA relatedness matrix of each requesting unary analysis or pair request, carrying its focal attribution metadata. One element is emitted per requester, however many requesters share the underlying build.
      structure: [map meta, list grm_files]
      pattern: "*.grm.{bin,N.bin,id}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - gcta_sparse:
      description: The sparse GCTA relatedness matrix of each requesting fastGWA analysis, carrying focal analysis metadata.
      structure: [map meta, list sparse_grm_files]
      pattern: "*.grm.{id,sp}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - gcta_ldms:
      description: The LD-by-MAF-stratified GCTA matrix family of each requesting unary GREML-LDMS analysis or bivariate LDMS request, carrying focal attribution metadata and explicit non-empty stratum prefix order.
      structure: [map meta, list grm_files, list grm_prefixes]
      pattern: "*.grm.{bin,N.bin,id}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - gcta_ldms_artifacts:
      description: Each unique LDMS base artifact before focal fan-out, for pipeline-owned keyed publication.
      structure: [map matrix_meta, list grm_files, list grm_prefixes]
      pattern: "*.grm.{bin,N.bin,id}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - ldak_kinship:
      description: The selected base or unrelated-sample child LDAK kinship artifact requested by each analysis unit. The artifact key remains beside unchanged focal metadata, and the keep list is present only for a subset child.
      structure: "[map meta, string artifact_key, list grm_files, path keep|[]]"
      pattern: "*.{grm.bin,grm.id,grm.details,grm.adjust,keep}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
authors:
  - "@andongni"
maintainers:
  - "@andongni"
