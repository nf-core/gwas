# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: route_ldak_kvik_associations
description: Resolve reusable predictor artifacts and route nf-core/gwas analyses through scientifically identical LDAK-KVIK Step 1 fits
keywords:
  - ldak
  - kvik
  - genome-wide association study
  - prediction reuse
  - predictor reuse
components:
  - ldak/thincommon
  - ldak/kvikstep1
  - ldak/kvikstep2
  - digestfilebytes
  - buildcanonicalpredictionkey
  - buildscientificartifactkey
input:
  - ch_genotypes:
      description: PLINK 1 genotype bundle for each LDAK-KVIK analysis, with its cohort's PLINK 1 view key. The key is the thin-common and Step 1 reuse identity and stays a tuple member, never in metadata
      structure: "[map meta, path bed, path bim, path fam, val view_key]"
      pattern: "*.{bed,bim,fam}"
      ontologies: []
  - ch_phenotypes:
      description: Headerless phenotype and optional quantitative and categorical covariates for each analysis
      structure: "[map meta, path phenotype, path quant_covariates|[], path cat_covariates|[]]"
      pattern: "*.{txt,tsv,pheno,phe,covar,cov}"
      ontologies: []
  - ch_extract_policy:
      description: Predictor subset resource and validated all, thin_common, or provided policy for each analysis
      structure: "[map meta, path extract|[], val subset_policy]"
      pattern: "*.in"
      ontologies: []
output:
  - results:
      description: LDAK-KVIK Step 2 association result files carrying each consuming analysis metadata map
      structure: "[map meta, path assoc]"
      pattern: "*.step2*.assoc"
      ontologies: []
  - harmonisation_input:
      description: LDAK-KVIK association tables prepared for harmonisation
      structure: "[map meta, path harmonisation_input]"
      pattern: "*.step2*.harmonisation.tsv"
      ontologies: []
  - progress:
      description: ThinCommon progress files, once per genotype-view and effective-thinning-options predictor artifact
      structure: "[map meta, path progress]"
      pattern: "*.progress"
      optional: true
      ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
