# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: route_ldak_kvik_associations
description: Resolve shared predictor artifacts and declare per-analysis LDAK-KVIK fits and testing requests
keywords:
  - ldak
  - kvik
  - genome-wide association study
  - explicit fit references
  - predictor reuse
components:
  - ldak/thincommon
  - plink_association_ldak_kvik
  - prepare_ldak_kvik_harmonisation
  - digestfilebytes
  - buildscientificartifactkey
input:
  - ch_genotypes:
      description: PLINK 1 genotype bundle for each LDAK-KVIK analysis, with its cohort's PLINK 1 view key. The key identifies shared thin-common resources and stays a tuple member
      structure: "[map meta, path bed, path bim, path fam, val view_key]"
      pattern: "*.{bed,bim,fam}"
      ontologies: []
  - ch_phenotypes:
      description: Headerless phenotype and optional quantitative and categorical covariates for each analysis
      structure: "[map meta, path phenotype, path quant_covariates|[], path cat_covariates|[]]"
      pattern: "*.{txt,tsv,pheno,phe,covar,cov}"
      ontologies: []
  - ch_extract_policy:
      description: Predictor subset resource and validated all, thin_common, or provided policy for each analysis
      structure: "[map meta, path extract|[], val subset_policy]"
      pattern: "*.in"
      ontologies: []
output:
  - harmonisation_input:
      description: LDAK-KVIK association tables prepared for harmonisation. The native association, summary, predictor and progress files stay in the work directory
      structure: "[map meta, path harmonisation_input]"
      pattern: "*.step2*.harmonisation.tsv"
      ontologies: []
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
