# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_association_ldak_kvik
description: Run LDAK-KVIK Step 1 and Step 2 association testing from PLINK1 genotype bundles
keywords:
  - ldak
  - kvik
  - ldak-kvik
  - gwas
  - association
  - plink
components:
  - ldak/thincommon
  - ldak/kvikstep1
  - ldak/kvikstep2
input:
  - meta:
      type: map
      description: Focal Step 1 genotype metadata. Public outputs retain this map.
  - step1_bed:
      type: file
      description: BED file for the Step 1 PLINK1 bundle
      pattern: "*.bed"
      ontologies: []
  - step1_bim:
      type: file
      description: BIM companion for the Step 1 PLINK1 bundle
      pattern: "*.bim"
      ontologies: []
  - step1_fam:
      type: file
      description: FAM companion for the Step 1 PLINK1 bundle
      pattern: "*.fam"
      ontologies: []
  - meta2:
      type: map
      description: Step 2 shard metadata in the second genotype tuple.
  - shard_bed:
      type: file
      description: BED file for one or more Step 2 PLINK1 shards
      pattern: "*.bed"
      ontologies: []
  - shard_bim:
      type: file
      description: BIM companion for each Step 2 PLINK1 shard
      pattern: "*.bim"
      ontologies: []
  - shard_fam:
      type: file
      description: FAM companion for each Step 2 PLINK1 shard
      pattern: "*.fam"
      ontologies: []
  - meta3:
      type: map
      description: Phenotype metadata in the third input tuple.
  - phenotype_file:
      type: file
      description: Phenotype file keyed by meta3.id
      pattern: "*.{txt,tsv,pheno,phe}"
      ontologies: []
  - is_binary:
      type: boolean
      description: LDAK-KVIK Step 1 model selector; true enables the binary phenotype model
  - meta4:
      type: map
      description: Quantitative-covariate metadata in the fourth input tuple.
  - quant_covariates_file:
      type: file
      description: Optional quantitative-covariate file keyed by meta4.id; use [] when absent
      pattern: "*.{txt,tsv,covar,cov}"
      optional: true
      ontologies: []
  - meta5:
      type: map
      description: Categorical-covariate metadata in the fifth input tuple.
  - cat_covariates_file:
      type: file
      description: Optional categorical-covariate file keyed by meta5.id; use [] when absent
      pattern: "*.{txt,tsv,covar,cov}"
      optional: true
      ontologies: []
  - meta6:
      type: map
      description: Predictor-subset metadata in the sixth input tuple.
  - extract_file:
      type: file
      description: Optional predictor subset file keyed by meta6.id; use [] for all or thin_common
      pattern: "*.in"
      optional: true
      ontologies: []
  - subset_policy:
      type: string
      description: "Predictor subset selector: all, thin_common, or provided"
  - meta7:
      type: map
      description: Step 2 sample-list metadata in the seventh input tuple.
  - keep_file:
      type: file
      description: Optional Step 2 sample list keyed by meta7.id; use [] when absent
      pattern: "*.{txt,tsv,keep}"
      optional: true
      ontologies: []
output:
  - meta:
      type: map
      description: Unchanged focal Step 1 genotype metadata, including shard-level Step 2 results.
  - results:
      type: file
      description: LDAK-KVIK Step 2 association result files
      pattern: "*.step2*.assoc"
      ontologies: []
  - harmonisation_input:
      type: file
      description: |
        Harmonisation-only LDAK-KVIK association tables carrying effect-allele
        frequency and per-variant effective analysis size from the companion
        summary output
      pattern: "*.step2*.harmonisation.tsv"
      ontologies: []
  - summaries:
      type: file
      description: Required LDAK-KVIK Step 2 summary-statistics files
      pattern: "*.step2*.summaries"
      ontologies: []
  - pvalues:
      type: file
      description: Optional LDAK-KVIK Step 2 p-value files
      pattern: "*.step2*.pvalues"
      optional: true
      ontologies: []
  - predictions:
      type: file
      description: LDAK-KVIK Step 1 prediction bundle
      pattern: "*.step1.{root,loco.details,loco.prs}"
      ontologies: []
  - effects:
      type: file
      description: Optional LDAK-KVIK Step 1 effect estimates
      pattern: "*.step1.effects"
      optional: true
      ontologies: []
  - progress:
      type: file
      description: ThinCommon progress files for analyses using thin_common
      pattern: "*.progress"
      optional: true
      ontologies: []
  - logs:
      type: file
      description: LDAK-KVIK Step 1 and Step 2 log files
      pattern: "*.step*.log"
      ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
