# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_prepare_grm_ldak
description: Calculate one LDAK base kinship artifact from PLINK1 data and derive each requested unrelated-sample child artifact
keywords:
  - ldak
  - grm
  - genetic-relationship-matrix
  - relatedness
  - plink
components:
  - ldak/calckins
  - ldak/filter
  - ldak/subgrm
input:
  - ch_genotypes:
      description: PLINK1 genotypes and required LDAK kinship power for one base artifact. Metadata identifies the base artifact rather than a focal consumer.
      structure: [map meta, path bed, path bim, path fam, number power]
      pattern: "*.bed, *.bim, *.fam"
      ontologies: []
  - ch_weights:
      description: Optional LDAK predictor weights for the same base artifact; use [] when absent.
      structure: "[map meta2, path weights_file|[]]"
      pattern: "*.{txt,weights}"
      optional: true
      ontologies: []
  - ch_subset_requests:
      description: Requested unrelated-sample child artifacts, each addressed by its parent base key and carrying child-artifact metadata.
      structure: [string parent_key, map derived_meta]
output:
  - base_grm:
      type: file
      description: Base all-sample LDAK kinship artifacts, each carrying base-artifact metadata
      pattern: "*.grm.{bin,id,details,adjust}"
      ontologies: []
  - subset_grm:
      type: file
      description: Unrelated-sample child kinship artifacts, each carrying child-artifact metadata
      pattern: "*.grm.{bin,id,details,adjust}"
      ontologies: []
  - filtered_list:
      type: file
      description: LDAK relatedness-filter keep and lose files for requested subset children
      pattern: "*.{keep,lose}"
      ontologies: []
  - maxrel:
      type: file
      description: LDAK maximum-relatedness diagnostic for requested subset children
      pattern: "*.maxrel"
      ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
