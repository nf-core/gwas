# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "plink_prepare_grm_ldms_gcta"
description: Build an explicitly ordered LD-by-MAF-stratified GCTA genetic relationship matrix family from a component plan
keywords:
  - gcta
  - ldms
  - linkage disequilibrium by minor allele frequency stratification
  - genome relationship matrix
  - grm
  - scatter gather
components:
  - plink_prepare_grm_gcta
input:
  - ch_plan:
      description: |
        Ordered stratum manifest and the SNP group files it names, as produced by
        `plink_prepare_ldms_plan_gcta`. Row order is the component order and each row's `group_filename`
        column names one of the staged group files. Public outputs retain meta.
      structure: [map meta, path strata_manifest, list snp_group_files]
      pattern: "*.strata.tsv, *_snp_group*.txt"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
        - edam: "http://edamontology.org/format_2330"
  - ch_genotypes:
      description: PLINK1 multi-file bundle for the focal analysis in the second metadata-bearing tuple.
      structure: [map meta2, path mfile, path bed, path bim, path fam]
      pattern: "*.mbfile, *.bed, *.bim, *.fam"
      ontologies:
        - edam: "http://edamontology.org/format_3003"
        - edam: "http://edamontology.org/format_2330"
  - ch_n_parts:
      description: Requested GRM part count in the third metadata-bearing tuple.
      structure: [map meta3, integer requested_parts]
output:
  - grm_family:
      description: Merged stratum GRM bundles and their prefixes in declared non-empty stratum order for each focal analysis.
      structure: [map meta, path grm_files, list grm_prefixes]
      pattern: "*.grm.{bin,N.bin,id}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - strata:
      description: Model and stratum provenance for each focal analysis.
      structure: [map meta, string model_key, string stratum_key, map provenance]
authors:
  - "@andongni"
maintainers:
  - "@andongni"
