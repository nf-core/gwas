# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: route_regenie_associations
description: Route nf-core/gwas analyses through REGENIE while reusing scientifically identical Step 1 fits
keywords:
  - regenie
  - genome-wide regression
  - gwas
  - association
  - prediction reuse
components:
  - plink_fit_regenie
  - regenie/step2
  - digestfilebytes
  - buildcanonicalpredictionkey
input:
  - ch_analyses:
      description: Canonical nf-core/gwas analysis records, each carrying its cohort's native genotype bundle in format-polymorphic member order and its cohort's native view key. REGENIE selects `--bed` or `--pgen` from the primary member's extension, so a PLINK 1 cohort is fitted without conversion. The view key is the Step 1 reuse identity and stays a tuple member; public outputs retain each consuming analysis map
      structure: "[map meta, path primary_genotype, path variant_file, path sample_file, path phenotype, path covariates|[], val view_key]"
      pattern: "*.{bed,bim,fam,pgen,pvar,psam,phe,pheno,covar,cov,txt,tsv}"
      ontologies: []
  - step2_bsize:
      description: REGENIE Step 2 block size
      structure: integer
  - step1_mode:
      description: REGENIE Step 1 execution mode; standard or chunked
      structure: string
  - step1_jobs:
      description: L0 job count for chunked Step 1; null for standard mode
      structure: integer|null
output:
  - results:
      description: REGENIE Step 2 association results
      structure: [map meta, path results]
      pattern: "*.regenie.gz"
      ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
