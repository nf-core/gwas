# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "plink_prepare_grm_ldms_mph"
description: Build an explicitly ordered LD-by-MAF-stratified family of native MPH genetic relationship matrices from a component plan
keywords:
  - mph
  - minque for partitioning heritability
  - ldms
  - linkage disequilibrium by minor allele frequency stratification
  - genome relationship matrix
  - grm
components:
  - custom/mphsnpinfo
  - mph/makegrm
input:
  - ch_plan:
      description: |
        Ordered stratum manifest and the SNP group files it names, as produced by
        `plink_prepare_ldms_plan_gcta`. Row order is the component order. Public outputs retain meta.
      structure: [map meta, path strata_manifest, list snp_group_files]
      pattern: "*.strata.tsv, *_snp_group*.txt"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
        - edam: "http://edamontology.org/format_2330"
  - ch_genotypes:
      description: PLINK1 bundle for the focal family in the second metadata-bearing tuple. The three members share one basename.
      structure: [map meta2, path bed, path bim, path fam]
      pattern: "*.{bed,bim,fam}"
      ontologies:
        - edam: "http://edamontology.org/format_3003"
        - edam: "http://edamontology.org/format_2330"
  - autosome_count:
      description: |
        Process-global highest integer chromosome code counted as autosomal. The plan is autosome-only by
        construction, so this is an assertion that the plan and the bundle belong together rather than a filter.
      structure: [integer autosome_count]
output:
  - grm_family:
      description: |
        Every component's MPH matrix bundle and the matching prefixes in manifest ordinal order. The prefix of
        component k is `<family>__%06d_<stratum_key>`, and MPH copies it verbatim into the result's `vc_name`,
        so the published result names its own components.
      structure: [map meta, path grm_files, list grm_prefixes]
      pattern: "*.grm.{bin,iid}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - counts:
      description: |
        Declared predictor counts, one file per family: one row per component in ordinal order, then
        `__unassigned__` (BIM rows in no component) and `__bim_rows__`.
      structure: [map meta, path counts_tsv]
      pattern: "*.snp_info.counts.tsv"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
