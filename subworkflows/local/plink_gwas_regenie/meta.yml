# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_gwas_regenie
description: Run REGENIE Step 1 fitting and Step 2 GWAS from PLINK-format genotype bundles
keywords:
  - regenie
  - gwas
  - plink
  - association
  - genotype
components:
  - plink_fit_regenie
  - regenie/step2
input:
  - meta:
      type: map
      description: Focal Step 1 genotype metadata. Public outputs retain this map.
  - step1_genotype_file:
      type: file
      description: Primary file in the Step 1 PLINK semantic union; BED for PLINK 1 or PGEN for PLINK 2
      pattern: "*.{bed,pgen}"
      ontologies: []
  - step1_variant_file:
      type: file
      description: Step 1 variant metadata; BIM for PLINK 1 or PVAR for PLINK 2
      pattern: "*.{bim,pvar,pvar.zst}"
      ontologies: []
  - step1_sample_file:
      type: file
      description: Step 1 sample metadata; FAM for PLINK 1 or PSAM for PLINK 2
      pattern: "*.{fam,psam}"
      ontologies: []
  - meta2:
      type: map
      description: Step 2 shard metadata in the second genotype tuple.
  - step2_genotype_file:
      type: file
      description: Primary file in the Step 2 PLINK semantic union; the staged basename identifies each shard
      pattern: "*.{bed,pgen}"
      ontologies: []
  - step2_variant_file:
      type: file
      description: Step 2 shard variant metadata; BIM for PLINK 1 or PVAR for PLINK 2
      pattern: "*.{bim,pvar,pvar.zst}"
      ontologies: []
  - step2_sample_file:
      type: file
      description: Step 2 shard sample metadata; FAM for PLINK 1 or PSAM for PLINK 2
      pattern: "*.{fam,psam}"
      ontologies: []
  - meta3:
      type: map
      description: Phenotype metadata in the third input tuple.
  - pheno:
      type: file
      description: REGENIE phenotype file keyed by meta3.id
      pattern: "*.{phe,pheno,txt,tsv}"
      ontologies: []
  - meta4:
      type: map
      description: Covariate metadata in the fourth input tuple.
  - covar:
      type: file
      description: Optional REGENIE covariate file keyed by meta4.id; use [] when absent
      pattern: "*.{covar,cov,txt,tsv}"
      optional: true
      ontologies: []
  - meta5:
      type: map
      description: Step 1 block-size metadata in the fifth input tuple.
  - step1_bsize:
      type: integer
      description: Step 1 block size keyed by meta5.id
  - meta6:
      type: map
      description: Step 2 block-size metadata in the sixth input tuple.
  - step2_bsize:
      type: integer
      description: Step 2 block size keyed by meta6.id
  - meta7:
      type: map
      description: Step 1 execution-mode metadata in the seventh input tuple.
  - step1_mode:
      type: string
      description: Step 1 execution mode keyed by meta7.id; use "standard" or "chunked"
  - meta8:
      type: map
      description: L0 job-count metadata in the eighth input tuple.
  - n_l0_jobs:
      type: integer
      description: L0 job count keyed by meta8.id for chunked Step 1; use [] for standard mode
output:
  - meta:
      type: map
      description: Unchanged focal Step 1 genotype metadata; results contain one record per Step 2 shard.
  - results:
      type: file
      description: REGENIE Step 2 association results
      pattern: "*.regenie.gz"
      ontologies: []
  - logs:
      type: file
      description: REGENIE log files from Step 1 and Step 2
      pattern: "*.log"
      ontologies: []
  - predictions:
      type: file
      description: REGENIE Step 1 prediction list
      pattern: "*_pred.list"
      ontologies: []
  - loco:
      type: file
      description: REGENIE Step 1 leave-one-chromosome-out predictions
      pattern: "*.loco.gz"
      ontologies: []
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
