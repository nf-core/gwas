lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    # The single module config is split into per-stage files under `conf/modules/`, so that a new
    # preparation or analysis route adds a file instead of editing a shared one. Both this `files_exist`
    # entry and the `modules_config` toggle below are required: the first stops lint demanding the
    # deleted file, the second stops the `withName:` check reading it.
    - conf/modules.config
  modules_config: false
nf_core_version: 4.0.3
repository_type: pipeline
template:
  author: Chris Wyatt, Fernando Duarte, Maxime Laurent
  description: A pipeline for Genome Wide Association Studies
  force: false
  is_nfcore: true
  name: gwas
  org: nf-core
  outdir: .
  skip_features:
    - igenomes
    - fastqc
  version: 1.0.0dev
