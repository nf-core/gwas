# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "attribute_regenie_predictions"
description: Attribute one REGENIE Step 1 prediction bundle to a consuming analysis identity
keywords:
  - regenie
  - genome-wide regression
  - gwas
  - prediction
  - leave-one-chromosome-out
  - loco
  - attribution
tools:
  - "attribute_regenie_predictions":
      description: "A static nf-core helper for attributing a shared REGENIE prediction bundle to a consuming analysis."
      homepage: "https://github.com/nf-core/gwas"
      documentation: "https://rgcgithub.github.io/regenie/options/"
      tool_dev_url: "https://github.com/nf-core/gwas"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy map containing the consuming analysis metadata
          e.g. `[ id:'analysis1' ]`
    - predictions:
        type: file
        description: |
          REGENIE Step 1 prediction list. Each phenotype entry is retained while its LOCO path is
          rewritten to the analysis-attributed LOCO basename.
        pattern: "*_pred.list"
        ontologies: []
    - loco:
        type: file
        description: |
          The single REGENIE Step 1 LOCO prediction file for the canonical PHENO phenotype column
        pattern: "*.loco.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3987" # GZIP
output:
  bundle:
    - - meta:
          type: map
          description: |
            Groovy map containing the consuming analysis metadata
            e.g. `[ id:'analysis1' ]`
      - "*.regenie_step1_pred.list":
          type: file
          description: REGENIE prediction list attributed to the consuming analysis
          pattern: "*.regenie_step1_pred.list"
          ontologies: []
      - "*.regenie_step1_1.loco.gz":
          type: file
          description: REGENIE LOCO predictions attributed to the consuming analysis
          pattern: "*.regenie_step1_1.loco.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3987" # GZIP
  versions_coreutils:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "cp --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "cp --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
containers:
