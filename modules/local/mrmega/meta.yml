name: "mrmega"
description: Run one genome-wide MR-MEGA meta-regression
keywords:
  - gwas
  - genome-wide association study
  - meta-analysis
  - meta-regression
  - MR-MEGA
tools:
  - "mrmega":
      description: Meta-regression of multi-ancestry genetic association studies
      homepage: "https://genomics.ut.ee/en/tools"
      documentation: "https://genomics.ut.ee/en/tools"
      licence:
        - "custom"
input:
  - - meta:
        type: map
        description: Groovy Map containing the meta-analysis request information
    - study_files:
        type: file
        description: Native MR-MEGA study inputs
        pattern: "*.txt.gz"
        ontologies: []
    - filelist:
        type: file
        description: Ordered staged file list
        pattern: "*.filelist.txt"
        ontologies: []
    - axes:
        type: integer
        description: Number of ancestry axes requested from MR-MEGA
    - trait_type:
        type: string
        description: Quantitative or binary trait selector
output:
  result:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis request information
      - "*.result":
          type: file
          description: Native MR-MEGA result with native P values preserved
          pattern: "*.result"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis request information
      - "*.log":
          type: file
          description: Native MR-MEGA log
          pattern: "*.log"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
