# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "attribute_ldak_kvik_predictions"
description: Attribute one LDAK-KVIK Step 1 prediction bundle to a consuming analysis identity
keywords:
  - ldak
  - kvik
  - gwas
  - prediction
  - attribution
tools:
  - "attribute_ldak_kvik_predictions":
      description: "A static nf-core helper for attributing a shared LDAK-KVIK prediction bundle to a consuming analysis."
      homepage: "https://github.com/nf-core/gwas"
      documentation: "https://dougspeed.com/ldak-kvik/"
      tool_dev_url: "https://github.com/nf-core/gwas"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy map containing the consuming analysis metadata
    - root:
        type: file
        description: LDAK-KVIK Step 1 root file
        pattern: "*.step1.root"
        ontologies: []
    - loco_details:
        type: file
        description: LDAK-KVIK leave-one-chromosome-out details
        pattern: "*.step1.loco.details"
        ontologies: []
    - loco_prs:
        type: file
        description: LDAK-KVIK leave-one-chromosome-out predictions
        pattern: "*.step1.loco.prs"
        ontologies: []
output:
  bundle:
    - - meta:
          type: map
          description: Groovy map containing the consuming analysis metadata
      - "*.ldak_kvik.step1.root":
          type: file
          description: Analysis-attributed LDAK-KVIK Step 1 root file
          ontologies: []
      - "*.ldak_kvik.step1.loco.details":
          type: file
          description: Analysis-attributed LDAK-KVIK LOCO details
          ontologies: []
      - "*.ldak_kvik.step1.loco.prs":
          type: file
          description: Analysis-attributed LDAK-KVIK LOCO predictions
          ontologies: []
  versions_coreutils:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "cp --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "cp --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
