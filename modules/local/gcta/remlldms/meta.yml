# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gcta_remlldms"
description: Run REML-LDMS heritability estimation from an explicitly ordered GRM family
keywords:
  - gcta
  - genome-wide complex trait analysis
  - reml
  - restricted maximum likelihood
  - ldms
  - linkage disequilibrium and minor allele frequency stratification
  - grm
  - genetic relationship matrix
  - genetics
tools:
  - "gcta":
      description: "Genome-wide Complex Trait Analysis (GCTA) estimates genetic relationships, variance components, and association statistics from genome-wide data."
      homepage: "https://yanglab.westlake.edu.cn/software/gcta/"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/static/gcta_doc_latest.pdf"
      tool_dev_url: "https://yanglab.westlake.edu.cn/software/gcta/"
      licence: ["GPL-3.0-only"]
      identifier: "biotools:gcta"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing GRM family analysis metadata
          e.g. `[ id:'plink_simulated_ldms' ]`
          `meta.id` supplies the overridable default output prefix.
    - grm_files:
        type: file
        description: Ordered GRM bundles; each .grm.bin determines one entry in the task-local MGRM manifest, preserving input order. Companion .grm.N.bin and .grm.id files must share its basename
        pattern: "*.grm.*"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy map containing phenotype metadata; should carry the same sample
          identity as `meta`, for example `[ id:'plink_simulated_ldms' ]`
    - phenotypes_file:
        type: file
        description: Phenotype file passed to `--pheno`
        pattern: "*.{phe,pheno,txt,tsv}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  - - meta3:
        type: map
        description: |
          Groovy map containing quantitative covariate metadata; should carry the
          same sample identity as `meta`, for example `[ id:'plink_simulated_ldms' ]`
    - quant_covariates_file:
        type: file
        description: Quantitative covariates file, pass `[]` when absent
        pattern: "*.{covar,cov,txt,tsv}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  - - meta4:
        type: map
        description: |
          Groovy map containing categorical covariate metadata; should carry the
          same sample identity as `meta`, for example `[ id:'plink_simulated_ldms' ]`
    - cat_covariates_file:
        type: file
        description: Categorical covariates file, pass `[]` when absent
        pattern: "*.{covar,cov,txt,tsv}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
output:
  reml_results:
    - - meta:
          type: map
          description: |
            Groovy map containing the unchanged input GRM-family analysis metadata
            e.g. `[ id:'plink_simulated_ldms' ]`
      - "*.hsq":
          type: file
          description: REML-LDMS result file
          pattern: "*.{hsq}"
          ontologies:
            - edam: "http://edamontology.org/format_2330"
  log:
    - - meta:
          type: map
          description: |
            Groovy map containing the unchanged input GRM-family analysis metadata
            e.g. `[ id:'plink_simulated_ldms' ]`
      - "*.log":
          type: file
          description: GCTA REML-LDMS log file
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330"
  versions_gcta:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "gcta":
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to retrieve the GCTA version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to retrieve the GCTA version
containers:
  conda:
    linux/amd64:
      lock_file: "modules/local/gcta/remlldms/.conda-lock/linux_amd64-bd-9bc35dc424fcf6e9_1.txt"
  docker:
    linux/amd64:
      build_id: "bd-9bc35dc424fcf6e9_1"
      name: "community.wave.seqera.io/library/gcta:1.94.1--9bc35dc424fcf6e9"
      scan_id: "sc-3daff72fa868d5d0_1"
  singularity:
    linux/amd64:
      build_id: "bd-abf1bf6c8de03d90_1"
      name: "oras://community.wave.seqera.io/library/gcta:1.94.1--abf1bf6c8de03d90"
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/46/46b0d05f0daa47561d87d2a9cac5e51edc2c78e26f1bbab439c688386241a274/data"
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
