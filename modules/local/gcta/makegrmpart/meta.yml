# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gcta_makegrmpart"
description: Compute one partition of a GCTA genetic relationship matrix
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genetic relationship matrix
  - genetics
tools:
  - "gcta":
      description: "GCTA is a tool for genome-wide complex trait analysis."
      homepage: "https://yanglab.westlake.edu.cn/software/gcta/"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/static/gcta_doc_latest.pdf"
      tool_dev_url: "https://github.com/jianyangqt/gcta"
      licence:
        - "GPL-3.0-only"
      identifier: biotools:gcta
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing GRM-partition sample metadata
          e.g. `[ id:'gcta_grm' ]`
    - mfile:
        type: file
        description: GCTA multi-input manifest consumed by `--mbfile` or
          `--mpfile`
        pattern: "*.{mbfile,mpfile,txt}"
        ontologies:
          - edam: "http://edamontology.org/format_2330"
    - bed_pgen:
        type: file
        description: Collection of PLINK primary genotype files referenced by the
          multi-input manifest
        pattern: "*.{bed,pgen}"
        ontologies:
          - edam: "http://edamontology.org/format_3003"
    - bim_pvar:
        type: file
        description: Collection of PLINK variant metadata files referenced by the
          multi-input manifest
        pattern: "*.{bim,pvar}"
        ontologies: []
    - fam_psam:
        type: file
        description: Collection of PLINK sample metadata files referenced by the
          multi-input manifest
        pattern: "*.{fam,psam}"
        ontologies: []
    - nparts:
        type: integer
        description: Required total number of GRM partitions requested via
          `--make-grm-part`
    - part:
        type: integer
        description: Required one-based index of the GRM partition to compute via
          `--make-grm-part`
  - - meta2:
        type: map
        description: |
          Groovy Map containing SNP-selection metadata
          e.g. `[ id:'snp_group1' ]`
    - snp_group_file:
        type: file
        description: Optional SNP extraction file passed to `--extract`; provide
          `[]` when absent
        pattern: "*.{txt,list}"
        ontologies:
          - edam: "http://edamontology.org/format_2330"
output:
  grm_files:
    - - meta:
          type: map
          description: |
            Groovy Map containing GRM-partition sample metadata
            e.g. `[ id:'gcta_grm' ]`
      - "*.part_${nparts}_*.grm.*":
          type: file
          description: Partitioned GRM output files, including ID, binary matrix,
            and sample-count matrix files. GCTA zero-pads the part index to the
            digit width of the requested part count.
          pattern: "*.part_${nparts}_*.grm.*"
          ontologies: []
      - nparts:
          type: integer
          description: Total number of GRM partitions requested via
            `--make-grm-part`
      - part:
          type: integer
          description: One-based index of the GRM partition computed via
            `--make-grm-part`
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing GRM-partition sample metadata
            e.g. `[ id:'gcta_grm' ]`
      - "*.log":
          type: file
          description: GCTA make-GRM-part log file
          pattern: "*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330"
  versions_gcta:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to generate the version of the tool
containers:
  conda:
    linux/amd64:
      lock_file: "modules/local/gcta/makegrmpart/.conda-lock/linux_amd64-bd-9bc35dc424fcf6e9_1.txt"
  docker:
    linux/amd64:
      build_id: "bd-9bc35dc424fcf6e9_1"
      name: "community.wave.seqera.io/library/gcta:1.94.1--9bc35dc424fcf6e9"
      scan_id: "sc-3daff72fa868d5d0_1"
  singularity:
    linux/amd64:
      build_id: "bd-abf1bf6c8de03d90_1"
      name: "oras://community.wave.seqera.io/library/gcta:1.94.1--abf1bf6c8de03d90"
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/46/46b0d05f0daa47561d87d2a9cac5e51edc2c78e26f1bbab439c688386241a274/data"
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
