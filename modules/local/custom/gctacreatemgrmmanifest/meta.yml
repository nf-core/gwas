# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctacreatemgrmmanifest"
description: Write the GCTA GRM roots of a focal analysis to a natural-sorted MGRM manifest
keywords:
  - genome-wide complex trait analysis
  - gcta
  - genomic relationship matrix
  - grm
  - multiple genomic relationship matrix
  - mgrm
  - manifest
  - genetics
tools:
  - "custom_gctacreatemgrmmanifest":
      description: "A static nf-core helper for constructing GCTA multiple-GRM manifests."
      homepage: "https://github.com/nf-core/modules"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#DataManagement"
      tool_dev_url: "https://github.com/nf-core/modules"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy map containing the focal analysis metadata
          e.g. `[ id:'analysis1' ]`
    - grm_files:
        type: file
        description: |
          Complete GCTA binary GRM bundles for every stratum of one focal analysis, with one
          .grm.id, .grm.bin and .grm.N.bin file per root. The manifest lists the GRM roots in
          natural-sorted (`sort -V`) order of their staged basenames.
        pattern: "*.grm.{id,bin,N.bin}"
        ontologies: []
output:
  mgrm_bundle:
    - - meta:
          type: map
          description: |
            Groovy map containing the focal analysis metadata
            e.g. `[ id:'analysis1' ]`
      - "${prefix}.mgrm":
          type: file
          description: |
            GCTA multiple-GRM manifest containing one staged GRM root per line, in natural-sorted
            GRM prefix order
          pattern: "${prefix}.mgrm"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Text
      - grm_files:
          type: file
          description: Complete GCTA binary GRM bundles referenced by the manifest
          pattern: "*.grm.{id,bin,N.bin}"
          ontologies: []
  versions_coreutils:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "sort --version | sed -n '1{s/sort (GNU coreutils) //;p}'":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - coreutils:
          type: string
          description: The tool name
      - "sort --version | sed -n '1{s/sort (GNU coreutils) //;p}'":
          type: eval
          description: The command used to retrieve the GNU Coreutils version
containers:
  conda:
    linux/amd64:
      lock_file: "modules/nf-core/custom/gctacreatemgrmmanifest/.conda-lock/linux_amd64-bd-838ba80435a629f8_1.txt"
  docker:
    linux/amd64:
      build_id: "bd-838ba80435a629f8_1"
      name: "community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8"
      scan_id: "sc-2b1453b6febde61b_1"
  singularity:
    linux/amd64:
      build_id: "bd-2f90c612c8e49f19_1"
      name: "oras://community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:2f90c612c8e49f19"
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/52/52ccce28d2ab928ab862e25aae26314d69c8e38bd41ca9431c67ef05221348aa/data"
