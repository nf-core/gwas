# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctamergegrmparts"
description: |
  Concatenate explicitly ordered row-partitioned GCTA dense GRM files into one bundle. `cat` joins three
  corresponding ordered lists -- GRM values (`.grm.bin`), per-pair marker counts (`.grm.N.bin`) and sample
  identifiers (`.grm.id`) -- in the order the caller supplies, which is the numeric part order of one GCTA
  `--make-grm-part` operation and need not be the lexical order of the file names. The module performs no
  SNP-group planning, cohort selection, normalisation or scientific recomputation, and preserves the
  incoming metadata. GNU coreutils is the executable owner and version provider; no helper package is
  required.
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genetic relationship matrix
  - merge
tools:
  - "coreutils":
      description: "GNU cat concatenates row-partitioned files in the supplied order."
      homepage: "https://www.gnu.org/software/coreutils/"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#MakingaGRM"
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy map containing GRM identity
    - grm_bin_parts:
        type: file
        description: GRM binary row parts in numeric part order; ordering is supplied by the caller.
        pattern: "*.grm.bin"
        ontologies: []
    - grm_n_bin_parts:
        type: file
        description: Matching per-pair marker-count row parts in the same order.
        pattern: "*.grm.N.bin"
        ontologies: []
    - grm_id_parts:
        type: file
        description: Matching sample-identity row parts in the same order.
        pattern: "*.grm.id"
        ontologies: []
output:
  grm_files:
    - - meta:
          type: map
          description: Groovy map containing GRM identity
      - "${prefix}.grm.*":
          type: file
          description: Concatenated GCTA dense-GRM bundle in explicit numeric part order
          pattern: "*.grm.*"
          ontologies: []
  versions_coreutils:
    - - ${task.process}:
          type: string
          description: Process name
      - coreutils:
          type: string
          description: Executable provider
      - "cat --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: GNU coreutils version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - coreutils:
          type: string
          description: Executable provider
      - "cat --version | head -n 1 | cut -d ' ' -f 4":
          type: eval
          description: GNU coreutils version
