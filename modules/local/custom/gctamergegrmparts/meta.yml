# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctamergegrmparts"
description: Concatenate explicitly ordered row-partitioned GCTA dense GRM files into one bundle
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genetic relationship matrix
  - merge
tools:
  - "custom_gctamergegrmparts":
      description: "A static helper for concatenating GCTA --make-grm-part outputs in explicit numeric part order."
      homepage: "https://github.com/nf-core/modules"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#MakingaGRM"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy map containing GRM identity
    - grm_files:
        type: file
        description: Complete set of row-partitioned GRM files staged for the ordered part records
        pattern: "*.grm.*"
        ontologies: []
    - ordered_parts:
        type: list
        description: Numeric-part-ordered records naming each staged GRM binary, sample-count and ID part
output:
  grm_files:
    - - meta:
          type: map
          description: Groovy map containing GRM identity
      - "${prefix}.grm.*":
          type: file
          description: Concatenated GCTA dense-GRM bundle in explicit numeric part order
          pattern: "*.grm.*"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"
authors:
  - "@andongni"
maintainers:
  - "@andongni"
