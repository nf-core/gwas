# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "custom_gctamergegrmparts"
description: Concatenate row-partitioned GCTA dense GRM files into a single GRM bundle
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genomic relationship matrix
  - merge
tools:
  - custom:
      description: Checked-in bash helper concatenating GCTA --make-grm-part outputs
      homepage: "https://github.com/nf-core/modules"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/#MakingaGRM"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy map containing GRM identity
    - grm_files:
        type: file
        description: Complete set of row-partitioned GRM files for one stratum (.grm.bin, .grm.N.bin and .grm.id parts, any order)
        pattern: "*.grm.*"
        ontologies: []
output:
  grm_files:
    - - meta:
          type: map
          description: Groovy map containing GRM identity
      - "${prefix}.grm.*":
          type: file
          description: Concatenated GCTA dense-GRM bundle (.grm.bin, .grm.N.bin and .grm.id)
          pattern: "*.grm.*"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"
authors:
  - "@andongni"
maintainers:
  - "@andongni"
