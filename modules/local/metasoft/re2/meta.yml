name: "metasoft_re2"
description: Run METASOFT and preserve its native meta-analysis result
keywords:
  - gwas
  - genome-wide association study
  - meta-analysis
  - random effects
  - RE2
tools:
  - "metasoft":
      description: Meta-analysis software implementing fixed, random, and Han-Eskin random-effects models
      homepage: "http://genetics.cs.ucla.edu/meta/"
      documentation: "http://genetics.cs.ucla.edu/meta/"
      licence:
        - "custom"
input:
  - - meta:
        type: map
        description: Groovy Map containing the meta-analysis request information
    - effect_matrix:
        type: file
        description: Native METASOFT effect matrix
        pattern: "*.txt"
        ontologies: []
output:
  result:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis request information
      - "*.metasoft.txt":
          type: file
          description: Native METASOFT result
          pattern: "*.metasoft.txt"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis request information
      - "*.metasoft.log":
          type: file
          description: Native METASOFT log
          pattern: "*.metasoft.log"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
