# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ldsc_mungesumstats"
description: Convert association summary statistics to the LDSC summary-statistics format
keywords:
  - ld score regression
  - linkage disequilibrium score regression
  - summary statistics
  - munging
  - genome-wide association study
tools:
  - "ldsc":
      description: LD Score Regression distinguishes confounding from polygenicity and estimates SNP heritability and genetic correlation from summary statistics
      homepage: "https://github.com/CBIIT/ldsc"
      documentation: "https://github.com/bulik/ldsc/wiki"
      tool_dev_url: "https://github.com/CBIIT/ldsc"
      licence: ["GPL-3.0-only"]
      identifier: "biotools:ldsc"
input:
  - - meta:
        type: map
        description: |
          Groovy map containing summary-statistics metadata.
          `meta.id` is required and provides the default output prefix.
    - sumstats:
        type: file
        description: Association summary statistics accepted by `munge_sumstats.py`
        pattern: "*.{txt,tsv,csv,txt.gz,tsv.gz,csv.gz}"
        ontologies: []
  - - meta2:
        type: map
        description: Groovy map containing merge-allele reference metadata
    - merge_alleles:
        type: file
        description: SNP and allele table passed to `--merge-alleles`, normally the HapMap3 `w_hm3.snplist`
        pattern: "*.{txt,tsv,snplist}"
        ontologies: []
output:
  munged_sumstats:
    - - meta:
          type: map
          description: Groovy map propagated from the summary-statistics input
      - "*.sumstats.gz":
          type: file
          description: Gzip-compressed LDSC summary statistics with SNP, A1, A2, N, and Z columns
          pattern: "*.sumstats.gz"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy map propagated from the summary-statistics input
      - "*.log":
          type: file
          description: Native LDSC munging log
          pattern: "*.log"
          ontologies: []
  versions_ldsc:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc:
          type: string
          description: The tool name
      - "python -c 'import importlib.metadata; print(importlib.metadata.version(\"ldsc\"))'":
          type: eval
          description: The expression used to obtain the LDSC distribution version
  versions_ldsc_native:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc_native:
          type: string
          description: The native LDSC version name
      - "cat /opt/venv/ldsc-native-version":
          type: eval
          description: The expression used to obtain the version reported by the LDSC command source
  versions_ldsc_source:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc_source_revision:
          type: string
          description: The source revision name
      - "cat /opt/venv/ldsc-source-revision":
          type: eval
          description: The expression used to obtain the pinned CBIIT/ldsc source revision
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - python:
          type: string
          description: The interpreter name
      - "python --version 2>&1 | sed 's/^Python //'":
          type: eval
          description: The expression used to obtain the Python version
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc:
          type: string
          description: The tool name
      - "python -c 'import importlib.metadata; print(importlib.metadata.version(\"ldsc\"))'":
          type: eval
          description: The expression used to obtain the LDSC distribution version
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc_native:
          type: string
          description: The native LDSC version name
      - "cat /opt/venv/ldsc-native-version":
          type: eval
          description: The expression used to obtain the version reported by the LDSC command source
    - - "${task.process}":
          type: string
          description: The name of the process
      - ldsc_source_revision:
          type: string
          description: The source revision name
      - "cat /opt/venv/ldsc-source-revision":
          type: eval
          description: The expression used to obtain the pinned CBIIT/ldsc source revision
    - - "${task.process}":
          type: string
          description: The name of the process
      - python:
          type: string
          description: The interpreter name
      - "python --version 2>&1 | sed 's/^Python //'":
          type: eval
          description: The expression used to obtain the Python version
notes: |
  The runtime pins the CBIIT/ldsc `ldsc39` revision `6c673952cee74bd5c57aef1555a03b1c015399a0`.
  CBIIT's distribution metadata is `3.0.2` while `ldsc.__version__` is `3.0.1`;
  both values and the exact source revision are emitted separately.
  Optional non-file arguments use `task.ext.args`; callers must not duplicate the
  module-owned `--sumstats`, `--merge-alleles`, or `--out` options.
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
