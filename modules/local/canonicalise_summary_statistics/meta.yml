name: "canonicalise_summary_statistics"
description: Validate one canonical nf-core/gwas summary-statistics table and emit deterministic provenance
keywords:
  - gwas
  - summary statistics
  - validation
input:
  - - meta:
        type: map
        description: Groovy Map containing stable summary-statistics identity and safe provenance metadata
    - candidate:
        type: file
        description: Candidate canonical summary-statistics table
        pattern: "*.{tsv,tsv.gz}"
        ontologies: []
    - source:
        type: file
        description: Original source table used only for checksum provenance
        pattern: "*"
        ontologies: []
output:
  summary_statistics:
    - - meta:
          type: map
          description: Groovy Map containing stable summary-statistics identity and safe provenance metadata
      - "*.canonical.tsv.gz":
          type: file
          description: Canonical compressed summary-statistics table
          pattern: "*.canonical.tsv.gz"
          ontologies: []
  provenance:
    - - meta:
          type: map
          description: Groovy Map containing stable summary-statistics identity and safe provenance metadata
      - "*.provenance.json":
          type: file
          description: Deterministic source and transformation provenance
          pattern: "*.provenance.json"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
