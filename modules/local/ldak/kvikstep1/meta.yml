# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ldak_kvikstep1"
description: "Run LDAK-KVIK step 1 to fit the genome-wide model and emit the minimal prediction artifact tuple consumed by ldak/kvikstep2"
keywords:
  - "ldak"
  - "kvik"
  - "gwas"
  - "association"
  - "linkage disequilibrium adjusted kinships"
  - "genome-wide association study"
tools:
  - "ldak6":
      description: "LDAK and LDAK-KVIK for mixed-model genome-wide association study (GWAS) and heritability analysis."
      homepage: "https://dougspeed.com/ldak/"
      documentation: "https://dougspeed.com/ldak-kvik/"
      tool_dev_url: "https://github.com/dougspeed/LDAK"
input:
  - - meta:
        type: map
        description: |
          Focal genotype metadata with a unique fit identifier. The BED/BIM/FAM files share a basename.
          `id` is the default Step 1 output prefix, which `task.ext.prefix` overrides.
    - bed:
        type: file
        description: PLINK BED genotype file passed to `--bfile`
        pattern: "*.bed"
        ontologies: []
    - bim:
        type: file
        description: PLINK BIM variant file paired with the BED input
        pattern: "*.bim"
        ontologies: []
    - fam:
        type: file
        description: PLINK FAM sample file paired with the BED input
        pattern: "*.fam"
        ontologies: []
  - - meta2:
        type: map
        description: Phenotype metadata. Optional phenotype selection and --binary YES use task.ext.args.
    - phenotype_file:
        type: file
        description: Phenotype file passed to `--pheno`
        pattern: "*.{txt,tsv,pheno,phe}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  - - meta3:
        type: map
        description: |
          Groovy Map containing quantitative covariate information
          e.g. `[ id:'qcov' ]`
    - quant_covariates_file:
        type: file
        optional: true
        description: Optional quantitative covariates file passed to `--covar`; provide `[]` when absent
        pattern: "*.{txt,tsv,covar,cov}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  - - meta4:
        type: map
        description: |
          Groovy Map containing categorical covariate information
          e.g. `[ id:'ccov' ]`
    - cat_covariates_file:
        type: file
        optional: true
        description: Optional categorical covariates file passed to `--factors`; provide `[]` when absent
        pattern: "*.{txt,tsv,covar,cov}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  - - meta5:
        type: map
        description: |
          Groovy Map containing predictor-subset information
          e.g. `[ id:'thin_common' ]`
    - extract_file:
        type: file
        optional: true
        description: Optional predictor list passed to `--extract`; provide `[]` when absent
        pattern: "*.{in,txt,list}"
        ontologies: []
output:
  predictions:
    - - meta:
          type: map
          description: Metadata map carried forward from the focal genotype input
      - "${prefix}.step1.root":
          type: file
          description: LDAK-KVIK step 1 root file
          pattern: "*.step1.root"
          ontologies:
            - edam: "http://edamontology.org/format_2330"
      - "${prefix}.step1.loco.details":
          type: file
          description: LDAK-KVIK step 1 leave-one-chromosome-out (LOCO) details file
          pattern: "*.step1.loco.details"
          ontologies: []
      - "${prefix}.step1.loco.prs":
          type: file
          description: LDAK-KVIK step 1 LOCO polygenic risk score (PRS) file. Together with the root and LOCO details
            files, this forms the direct `ldak/kvikstep2` handoff tuple; phenotype and covariate files remain explicit
            step 2 inputs.
          pattern: "*.step1.loco.prs"
          ontologies: []
  effects:
    - - meta:
          type: map
          description: Metadata map carried forward from the focal genotype input
      - "${prefix}.step1.effects":
          type: file
          optional: true
          description: Optional LDAK-KVIK step 1 effects file produced for quantitative traits
          pattern: "*.step1.effects"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Metadata map carried forward from the focal genotype input
      - "${prefix}.step1.log":
          type: file
          description: LDAK-KVIK step 1 log file
          pattern: "*.step1.log"
          ontologies: []
  versions_ldak6:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The command used to generate the version of the tool
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
containers:
  conda:
    linux/amd64:
      lock_file: modules/local/ldak/kvikstep1/.conda-lock/linux_amd64-bd-452828f72b3c9129_1.txt
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/ldak6_r-base:452828f72b3c9129
      build_id: bd-452828f72b3c9129_1
      scan_id: sc-65cc7b1c1a9a20b6_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/ldak6_r-base:e8012f1be139af77
      build_id: bd-e8012f1be139af77_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/c9/c94e5424f08cbd7e0856ab3c3a9992b4080944a5d0c497ce0abcceb413db4a3e/data
