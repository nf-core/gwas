# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ldak_reml"
description: Run linkage disequilibrium-adjusted kinship (LDAK) restricted maximum likelihood (REML) heritability estimation on a precomputed genomic relationship matrix (GRM) and phenotype
keywords:
  - ldak
  - linkage disequilibrium adjusted kinship
  - reml
  - restricted maximum likelihood
  - heritability
tools:
  - ldak6:
      description: LDAK toolset for kinship, heritability, and association analyses
      homepage: https://dougspeed.com/ldak/
      documentation: https://dougspeed.com/ldak/
      licence: ["GPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing phenotype metadata.
          Only `meta.id` is required; it provides the default output prefix.
    - phenotype_file:
        type: file
        description: Headerless phenotype file passed to `--pheno`
        pattern: "*.{phe,pheno,txt,tsv}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing GRM metadata.
          Expected keys:
            - id (string): GRM identifier.
    - grm_files:
        type: file
        description: GRM bundle (`.grm.bin`, `.grm.id`, `.grm.details`, `.grm.adjust`) sharing a common basename
        pattern: "*.{grm.bin,grm.id,grm.details,grm.adjust}"
        ontologies: []
  - - meta3:
        type: map
        description: Metadata map paired with optional keep input.
    - keep_file:
        type: file
        optional: true
        description: Optional keep file for sample filtering; pass [] when GRM is pre-filtered
        ontologies: []
  - - meta4:
        type: map
        description: Metadata map paired with optional quantitative covariates input.
    - quant_covariates_file:
        type: file
        optional: true
        description: Optional quantitative covariates file passed to `--covar`; pass [] when absent
        ontologies: []
  - - meta5:
        type: map
        description: Metadata map paired with optional categorical covariates input.
    - cat_covariates_file:
        type: file
        optional: true
        description: Optional categorical covariates file passed to `--factors`; pass [] when absent
        ontologies: []
output:
  reml_results:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.reml":
          type: file
          description: REML summary output (`<prefix>.reml`)
          ontologies: []
  coeff:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.coeff":
          type: file
          description: Fixed-effect coefficient estimates (`<prefix>.coeff`)
          ontologies: []
  combined:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.combined":
          type: file
          optional: true
          description: Optional combined output (`<prefix>.combined`)
          ontologies: []
  cross:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.cross":
          type: file
          description: REML cross-product diagnostics (`<prefix>.cross`)
          ontologies: []
  indi_blp:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.indi.blp":
          type: file
          description: Individual best linear prediction (BLP) output (`<prefix>.indi.blp`)
          ontologies: []
  indi_res:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.indi.res":
          type: file
          description: Individual residual output (`<prefix>.indi.res`)
          ontologies: []
  progress:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.progress":
          type: file
          description: Optimisation progress output (`<prefix>.progress`)
          ontologies: []
  share:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.share":
          type: file
          description: Heritability share estimates (`<prefix>.share`)
          ontologies: []
  vars:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.vars":
          type: file
          description: Variance component output (`<prefix>.vars`)
          ontologies: []
  reml_liability:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.reml.liab":
          type: file
          optional: true
          description: Liability-scale REML summary, written only when a caller passes `--prevalence` for a binary trait
          ontologies: []
  coeff_liability:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.coeff.liab":
          type: file
          optional: true
          description: Liability-scale fixed-effect coefficients, written only when a caller passes `--prevalence` for a binary trait
          ontologies: []
  indi_blp_liability:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.indi.blp.liab":
          type: file
          optional: true
          description: Liability-scale individual BLP output, written only when a caller passes `--prevalence` for a binary trait
          ontologies: []
  liability_factor:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.factor":
          type: file
          optional: true
          description: Observed-to-liability conversion factor diagnostic, written only when a caller passes `--prevalence` for a binary trait
          ontologies: []
  log:
    - - meta:
          type: map
          description: Metadata map propagated from input
      - "*.log":
          type: file
          description: LDAK REML log file (`<prefix>.log`)
          ontologies: []
  versions_ldak6:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The expression used to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The expression used to obtain the version of the tool
notes: |
  `task.ext.args` is passed directly to LDAK and carries its optional arguments, such as the phenotype selector `--mpheno` and the
  `--prevalence` that turns on the liability-scale outputs.
