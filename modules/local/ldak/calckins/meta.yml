name: ldak_calckins
description: Calculate kinship matrices with linkage disequilibrium-adjusted kinship (LDAK), configurable power, and optional single nucleotide polymorphism (SNP) weights
keywords:
  - ldak
  - linkage disequilibrium adjusted kinship
  - genomic relationship matrix
  - kinship
  - grm
  - weights
tools:
  - ldak6:
      description: LDAK toolset for kinship, heritability, and association analyses
      homepage: https://dougspeed.com/ldak/
      documentation: https://dougspeed.com/ldak/
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing genotype-bundle metadata.
          Expected keys:
            - id (string): Sample identifier used as output prefix (for example, 'plink_merged').
    - bed:
        type: file
        description: PLINK BED genotype file
        ontologies: []
    - bim:
        type: file
        description: PLINK BIM variant file
        ontologies: []
    - fam:
        type: file
        description: PLINK FAM sample file
        ontologies: []
    - power:
        type: float
        description: Required LDAK `--power` value controlling the predictor-scaling heritability model
  - - meta2:
        type: map
        description: Metadata map for the optional weights resource.
    - weights_file:
        type: file
        optional: true
        description: Optional LDAK predictor weights file; use an empty list when absent.
        ontologies: []
output:
  ldak_grm:
    - - meta:
          type: map
          description: Metadata map carried forward from input
      - "${prefix}.grm.{bin,id,details,adjust}":
          type: file
          description: LDAK genomic relationship matrix (GRM) with its sample identifiers, details and adjustment factors, consumed as one bundle
          pattern: "*.grm.{bin,id,details,adjust}"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Metadata map carried forward from input
      - "${prefix}.log":
          type: file
          description: LDAK kinship calculation log file (`<prefix>.log`)
          ontologies: []
  versions_ldak6:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The expression used to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldak6:
          type: string
          description: The tool name
      - ldak6 --version 2>&1 | grep -oP '(?<=^Version )[0-9.]+':
          type: eval
          description: The expression used to obtain the version of the tool
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
