name: normalise_ldsc
description: Normalize native LDSC H2 or RG logs into estimand views, diagnostics and request provenance without selecting among estimators
keywords:
  - ld score regression
  - heritability
  - genetic correlation
  - provenance
tools:
  - python:
      description: Python standard-library runtime
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
input:
  - - meta:
        type: map
        description: Resolved LDSC request, endpoint, prevalence, reference and munging metadata
    - observed_log:
        type: file
        description: Native observed-scale LDSC H2 or RG log
        pattern: "*.log"
    - liability_log:
        type: file
        description: Optional native liability-scale LDSC H2 or RG log
        pattern: "*.log"
        optional: true
    - munging_logs:
        type: file
        description: One unary or two ordered pairwise native LDSC munging logs
        pattern: "*.log"
output:
  heritability:
    - - meta:
          type: map
          description: Request metadata propagated from input
      - heritability.tsv:
          type: file
          description: Unary or ordered endpoint heritability estimands on every native scale emitted
  genetic_correlation:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - genetic_correlation.tsv:
          type: file
          description: Pair genetic-correlation estimand with uncertainty, test statistic and p-value
          optional: true
  genetic_covariance:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - genetic_covariance.tsv:
          type: file
          description: Pair genetic-covariance estimands on every native scale emitted
          optional: true
  diagnostics:
    - - meta:
          type: map
          description: Request metadata propagated from input
      - diagnostics.tsv:
          type: file
          description: Native regression diagnostics, warnings and completion classification
  provenance:
    - - meta:
          type: map
          description: Request metadata propagated from input
      - provenance.json:
          type: file
          description: Request, endpoint, reference, munging, native-argument, classification and artifact provenance
  versions:
    - versions.yml:
        type: file
        description: Software versions
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
