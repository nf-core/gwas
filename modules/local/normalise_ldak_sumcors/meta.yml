name: normalise_ldak_sumcors
description: Normalize LDAK SumCors outputs into heritability, genetic covariance, genetic correlation, diagnostics and provenance views
keywords:
  - ldak
  - sumcors
  - genetic correlation
  - provenance
tools:
  - python:
      description: Python standard-library runtime
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
input:
  - - meta:
        type: map
        description: Resolved SumCors relationship, endpoint, reference and effective-option metadata
    - correlations:
        type: file
        description: Native SumCors component table
        pattern: "*.cors"
    - correlations_full:
        type: file
        description: Native category-level SumCors table
        pattern: "*.cors.full"
    - overlap:
        type: file
        description: Native tagging overlap diagnostics
        pattern: "*.overlap"
    - ldak_log:
        type: file
        description: Captured native LDAK log
        pattern: "*.log"
    - left_preparation:
        type: file
        description: Left canonical-to-LDAK preparation provenance
        pattern: "*.preparation.json"
    - right_preparation:
        type: file
        description: Right canonical-to-LDAK preparation provenance
        pattern: "*.preparation.json"
    - correlations_liability:
        type: file
        optional: true
        description: Native binary-binary liability-scale SumCors table when all four prevalence values were supplied
        pattern: "*.cors.liab"
output:
  heritability:
    - - meta:
          type: map
          description: Resolved request metadata propagated from input
      - heritability.tsv:
          type: file
          description: Ordered endpoint marginal heritability estimates on every native scale emitted
  genetic_correlation:
    - - meta:
          type: map
          description: Resolved request metadata propagated from input
      - genetic_correlation.tsv:
          type: file
          description: Scale-invariant pairwise genetic correlation estimate
  genetic_covariance:
    - - meta:
          type: map
          description: Resolved request metadata propagated from input
      - genetic_covariance.tsv:
          type: file
          description: Native coheritability or genetic-covariance estimates on every emitted scale
  diagnostics:
    - - meta:
          type: map
          description: Resolved request metadata propagated from input
      - diagnostics.tsv:
          type: file
          description: Intercept, overlap, predictor-count and classification diagnostics
  provenance:
    - - meta:
          type: map
          description: Resolved request metadata propagated from input
      - provenance.json:
          type: file
          description: Oriented endpoint, reference, policy, execution, warning and native-artifact provenance
  versions:
    - versions.yml:
        type: file
        description: Software versions
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
